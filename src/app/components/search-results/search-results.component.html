<div [@fadeIn] class="mt-4">
    <div class="position-relative w-75 mx-auto animated slideInDown">
        <input class="form-control border-0 rounded-pill w-100 py-2 ps-4 pe-5" [style.border]="'1px solid #86B817 !important'" type="text" placeholder="Search another destination"
            aria-label="Destination"
            [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" />
            <button type="button" class="btn btn-primary rounded-pill px-4 position-absolute top-0 end-0 me-1" (click)="onSearch()" style="margin-top: 3px;">
                <span class="d-none d-md-inline">Search</span> <!-- Show "Search" on larger screens -->
                <i class="fa fa-search d-inline d-md-none"></i> <!-- Show search icon on small screens -->
              </button>              
    </div>

    <div class="container mt-4">
        <ul class="nav nav-tabs sticky-header" id="responsiveTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab1-tab" data-bs-toggle="tab" data-bs-target="#tab1" type="button"
                    role="tab" aria-controls="tab1" aria-selected="true">
                    Hotels
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab2-tab" data-bs-toggle="tab" data-bs-target="#tab2" type="button"
                    role="tab" aria-controls="tab2" aria-selected="false">
                    Restaurants
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab3-tab" data-bs-toggle="tab" data-bs-target="#tab3" type="button"
                    role="tab" aria-controls="tab3" aria-selected="false">
                    Tour
                </button>
            </li>
        </ul>
        <p class="affiliate-note mt-2 mb-0">
            Booking links may earn CitiTour a commission at no extra cost to you.
        </p>
        <div class="tab-content position-relative" id="responsiveTabsContent">
            <div class="tab-pane fade show active" id="tab1" role="tabpanel" aria-labelledby="tab1-tab">
                <div class="p-3">
                    <div *ngIf="searchRecommendation?.hotels?.length > 0;else nodata" class="d-flex flex-column">
                        <div *ngFor="let hotel of searchRecommendation?.hotels; let i = index" [@fadeIn]>
                            <app-hotel-details [hotel]="hotel"></app-hotel-details>
                            <app-google-ads *ngIf="i === 2"></app-google-ads>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="tab2" role="tabpanel" aria-labelledby="tab2-tab">
                <div class="p-3">
                    <div *ngIf="searchRecommendation?.restaurants?.length > 0;else nodata" class="d-flex flex-column">
                        <div *ngFor="let resturant of searchRecommendation?.restaurants" [@fadeIn]>
                            <app-resturant-details [restaurant]="resturant"></app-resturant-details>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="tab3" role="tabpanel" aria-labelledby="tab3-tab">
                <div class="p-3">
                    <div *ngIf="searchRecommendation?.tours?.length > 0;else nodata" class="d-flex flex-column">
                        <div *ngFor="let tour of searchRecommendation?.tours" [@fadeIn]>
                            <app-tour-details [tour]="tour"></app-tour-details>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #nodata>
    <div class="no-data">
        <p class="mb-1">No results for this category yet.</p>
        <p class="mb-0">Try a nearby larger city, or check the other tabs.</p>
    </div>
  </ng-template>
