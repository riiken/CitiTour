<div class="container shadow" *ngIf="hotel">
    <!-- Row for Hotel Details -->
    <div class="row">
      <!-- Hotel Image Column -->
      <div class="col-md-4 image-container">
        <img [src]="hotel.thumbnail?hotel.thumbnail:'assets/img/hotelimg.jpg'" class="card-img-top" alt="{{ hotel.name }}">
        <div *ngIf="!hotel?.photos?.length" class="other-photos">
          <div class="photos-container">
            <img [src]="'assets/img/hotelimg1.jpg'" alt="" class="photos-container-img">
          </div>
          <div class="photos-container">
            <img [src]="'assets/img/hotelimg2.jpg'" alt="" class="photos-container-img">
          </div>
        </div>
        <div *ngIf="hotel?.photos?.length" class="other-photos">
          <div *ngFor="let photo of hotel?.photos?.slice(1,3)" class="photos-container">
            <img [src]="photo" alt="" class="photos-container-img">
          </div>
        </div>
      </div>
  
      <!-- Hotel Info Column -->
      <div class="col-md-8">
        <div class="card h-100">
          <div class="card-body">
            <span class="card-title">{{ hotel?.name }}</span>
            <span *ngIf="hotel?.ranking?.current_rank" class="card-text">#{{ hotel?.ranking?.current_rank}} of {{hotel?.ranking?.total}}</span>
            <div class="d-flex align-items-start row">
              <div class="d-flex flex-column col-md-6 gp-5">
                <span class="ratings font-16">
                  <ng-container *ngFor="let star of [1, 2, 3, 4, 5]; let i = index">
                    <i class="fa" [ngClass]="i < (hotel?.rating?.total || 0) ? 'fa-star filled' : 'fa-star empty'"></i>
                  </ng-container>
                </span>            
                <span class="reviews opacity-7">{{ hotel?.reviewsCount }} reviews</span>
                <div class="d-flex flex-column opacity-7 font-14">
                  <span>{{ hotel?.contacts?.streetAddress }}</span>
                  <a [href]="'tel:' + hotel?.contacts?.phone" class="color-tour">{{ hotel?.contacts?.phone }}</a>
                </div>
              </div>
              <div class="amenities d-flex flex-wrap gp-10 col-md-6">
                <span class="amenities-item d-flex align-items-center" *ngFor="let amenity of hotel?.amenities">
                  <i class="fa fa-check-circle"></i> {{ amenity }}
                </span>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-auto flex-wrap gp-5">
              <div class="d-flex flex-column">
                <strong><span class="hotel-price font-20" appCurrencyConverter [amount]="hotel?.priceMin" [fromCurrency]="hotel?.currency"></span></strong>
              <div class="hotel-styles color-tour flex-wrap">
                <div *ngFor="let style of hotel?.styles" class="white-space-no-wrap">
                  {{style}},
                </div>
              </div>
              </div>
              <a [href]="hotel?.url" target="_blank" class="btn btn-primary view-btn">View</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
