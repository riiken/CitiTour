<div class="container shadow" *ngIf="hotel">
    <!-- Row for Hotel Details -->
    <div class="row">
      <!-- Hotel Image Column -->
      <div class="col-md-4 image-container">
        <img [src]="hotel.thumbnail" class="card-img-top" alt="{{ hotel.name }}">
        <div class="other-photos">
          <div *ngFor="let photo of hotel.photos?.slice(0,2)" class="photos-container">
            <img [src]="photo" alt="" class="photos-container-img">
          </div>
        </div>
      </div>
  
      <!-- Hotel Info Column -->
      <div class="col-md-8">
        <div class="card h-100">
          <div class="card-body">
            <span class="card-title">{{ hotel.name }}</span>
            <span class="card-text">#{{ hotel.ranking.current_rank}} of {{hotel.ranking.total}}</span>
            <div class="d-flex align-items-start row">
              <div class="d-flex flex-column col-md-6 gp-5">
                <span class="ratings font-16">
                  <ng-container *ngFor="let star of [1, 2, 3, 4, 5]; let i = index">
                    <i class="fa" [ngClass]="i < (hotel?.rating?.total || 0) ? 'fa-star filled' : 'fa-star empty'"></i>
                  </ng-container>
                </span>            
                <span class="reviews opacity-7">{{ hotel.reviewsCount }} reviews</span>
                <div class="d-flex flex-column opacity-7 font-14">
                  <span>{{ hotel?.contacts?.streetAddress }}</span>
                  <span>{{ hotel?.contacts?.phone }}</span>
                </div>
              </div>
              <div class="amenities d-flex flex-wrap gp-10 col-md-6">
                <span class="amenities-item d-flex align-items-center" *ngFor="let amenity of hotel?.amenities">
                  <i class="fa fa-check-circle"></i> {{ amenity }}
                </span>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-auto flex-wrap gp-5">
              <div class="d-flex flex-column">
                <span class="hotel-price font-20"><strong>{{ hotel.priceMin | currency: hotel.currency }}</strong></span>
              <div class="hotel-styles color-tour">
                <div *ngFor="let style of hotel.styles">
                  {{style}},
                </div>
              </div>
              </div>
              <a [href]="hotel.url" target="_blank" class="btn btn-primary view-btn">View</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
