<div class="container shadow" *ngIf="tour">
  <!-- Row for tour Details -->
  <div class="row">
    <!-- tour Image Column -->
    <div class="col-md-4 image-container">
      <img [src]="tour.image?tour.image:'assets/img/tourimg.jpg'" class="card-img-top" alt="{{ tour.title }}">
      <div *ngIf="!tour?.photos?.length" class="other-photos">
        <div class="photos-container">
          <img [src]="'assets/img/tourimg1.jpg'" alt="" class="photos-container-img">
        </div>
        <div class="photos-container">
          <img [src]="'assets/img/tourimg2.jpg'" alt="" class="photos-container-img">
        </div>
      </div>
      <div *ngIf="tour?.photos?.length" class="other-photos">
        <div *ngFor="let photo of tour?.photos?.slice(1,3)" class="photos-container">
          <img [src]="photo" alt="" class="photos-container-img">
        </div>
      </div>
    </div>

    <!-- tour Info Column -->
    <div class="col-md-8">
      <div class="card h-100">
        <div class="card-body">
          <span class="card-title">{{ tour?.title }}</span>
          <span *ngIf="tour?.category" class="card-text">{{tour?.category}}</span>
          <div class="d-flex align-items-start row">
            <div class="d-flex flex-column col-md-6 gp-5">
              <span class="ratings font-16">
                <ng-container *ngFor="let star of [1, 2, 3, 4, 5]; let i = index">
                  <i class="fa" [ngClass]="i < (tour?.rating || 0) ? 'fa-star filled' : 'fa-star empty'"></i>
                </ng-container>
              </span>            
              <span class="reviews opacity-7">{{ tour?.reviewsCount }} reviews</span>
            </div>
            <div class="amenities d-flex flex-wrap align-items-center gp-10 col-md-6">
              <span class="amenities-item d-flex align-items-center" *ngFor="let language of tour?.languages">
                <i class="fa fa-check-circle"></i> {{ language }}
              </span>
              <span class="font-14">{{tour?.operator}}</span>
            </div>
          </div>
          <div class="d-flex flex-column opacity-7 font-14 gp-5">
            <span>{{ tour?.description }}</span>
            <span class="color-tour">{{tour?.duration}}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-auto flex-wrap gp-5">
            <div class="d-flex flex-column">
              <strong><span class="hotel-price font-20" appCurrencyConverter [amount]="tour?.price" [fromCurrency]="tour?.currency"></span></strong>
            <div *ngIf="tour?.cancellation" class="tour-styles color-tour">
              {{tour?.cancellation}}
            </div>
            </div>
            <div class="d-flex gp-5 flex-wrap">
              <a *ngIf="tour?.url" [href]="tour.url" target="_blank" rel="noopener" class="btn btn-outline-secondary view-btn">Details</a>
              <a *ngIf="tour?.bookingUrl" [href]="tour.bookingUrl" target="_blank" rel="sponsored noopener" class="btn btn-primary view-btn">Book activity</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
