<div class="container shadow" *ngIf="restaurant">
  <!-- Row for restaurant Details -->
  <div class="row">
    <!-- restaurant Image Column -->
    <div class="col-md-4 image-container">
      <img [src]="restaurant.thumbnail?restaurant.thumbnail:'assets/img/restaurantimg.jpg'" class="card-img-top" alt="{{ restaurant.name }}">
      <div *ngIf="!restaurant?.photos?.length" class="other-photos">
        <div class="photos-container">
          <img [src]="'assets/img/restaurantimg1.jpg'" alt="" class="photos-container-img">
        </div>
        <div class="photos-container">
          <img [src]="'assets/img/restaurantimg2.jpg'" alt="" class="photos-container-img">
        </div>
      </div>
      <div *ngIf="restaurant?.photos?.length" class="other-photos">
        <div *ngFor="let photo of restaurant?.photos?.slice(0, 2)" class="photos-container">
          <div class="loader-container" *ngIf="isLoading">
            <div class="loader"></div> <!-- This is the actual loader -->
          </div>
          
          <img 
            [src]="photo" 
            alt="" 
            class="photos-container-img" 
            [ngClass]="{'loading': isLoading}" 
            (load)="isLoading = false" 
            (error)="isLoading = false"> <!-- handle image load error as well -->
        </div>
        
      </div>
    </div>

    <!-- restaurant Info Column -->
    <div class="col-md-8">
      <div class="card h-100">
        <div class="card-body">
          <span class="card-title">{{ restaurant?.name }}</span>
          <span *ngIf="restaurant?.openStatusText" class="card-text">{{restaurant?.openStatusText}}</span>
          <div class="d-flex align-items-start row">
            <div class="d-flex flex-column col-md-6 gp-5">
              <span class="ratings font-16">
                <ng-container *ngFor="let star of [1, 2, 3, 4, 5]; let i = index">
                  <i class="fa" [ngClass]="i < (restaurant?.rating || 0) ? 'fa-star filled' : 'fa-star empty'"></i>
                </ng-container>
              </span>            
              <span class="reviews opacity-7">{{ restaurant?.reviewsCount }} reviews</span>
              <div class="d-flex flex-column opacity-7 font-14">
                <span>{{ restaurant?.address?.fullAddress }}</span>
                <a [href]="'tel:' + restaurant?.phone" class="color-tour">{{ restaurant?.phone }}</a>
              </div>
            </div>
            <div class="amenities d-flex flex-wrap gp-10 col-md-6">
              <span class="amenities-item d-flex align-items-center" *ngFor="let cuisine of restaurant?.cuisines">
                <i class="fa fa-check-circle"></i> {{ cuisine }}
              </span>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-auto flex-wrap gp-5">
            <div class="d-flex flex-column">
            <span *ngIf="restaurant?.menu" class="restaurant-price font-20">
              <a [href]="restaurant?.menu" target="_blank" class="font-14 color-tour">Menu</a>
            </span>
            <!-- <div class="restaurant-styles color-tour">
              <div *ngFor="let style of restaurant.styles">
                {{style}},
              </div>
            </div> -->
            </div>
            <a [href]="restaurant?.link" target="_blank" class="btn btn-primary view-btn">View</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
