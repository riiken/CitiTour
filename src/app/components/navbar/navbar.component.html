

  <div class="container-fluid position-relative p-0" [style.background]="!mobileVersion ? '#484E54' : ''">
    <nav appNavbarSticky class="navbar navbar-expand-lg navbar-light px-4 px-lg-5 py-3 py-lg-0">
        <a routerLink="/home" class="navbar-brand p-0">
            <h1 class="text-primary m-0"><i class="fa fa-map-marker me-3"></i>Cititour</h1>
        </a>
        <button class="navbar-toggler" type="button" aria-label="Toggle navigation" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="fa fa-bars"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto py-0">
                <a routerLink="/home" routerLinkActive="active" class="nav-item nav-link">Home</a>
                <a routerLink="/plan-trip" routerLinkActive="active" class="nav-item nav-link">Plan a trip</a>
                <a *ngIf="isLoggedIn" routerLink="/my-trips" routerLinkActive="active" class="nav-item nav-link">My trips</a>

                <a routerLink="/list-your-business" routerLinkActive="active" class="nav-item nav-link">List your business</a>
                <a routerLink="/contact" routerLinkActive="active" class="nav-item nav-link">Contact</a>
            </div>

            <!-- Auth Buttons -->
            <div class="d-flex align-items-center ms-3">
                <!-- Not Logged In -->
                <ng-container *ngIf="!isLoggedIn">
                    <button class="btn btn-outline-primary rounded-pill py-2 px-4 me-2" (click)="goToLogin()">
                        <i class="fa fa-sign-in me-2"></i>Login
                    </button>
                    <button class="btn btn-primary rounded-pill py-2 px-4" (click)="goToRegister()">
                        <i class="fa fa-user-plus me-2"></i>Register
                    </button>
                </ng-container>

                <!-- Logged In -->
                <ng-container *ngIf="isLoggedIn">
                    <div class="dropdown">
                        <button class="btn btn-primary rounded-pill py-2 px-3 dropdown-toggle d-flex align-items-center"
                                type="button"
                                id="userDropdown"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            <div class="user-avatar me-2">{{ getUserInitial() }}</div>
                            <span class="d-none d-md-inline">{{ currentUser?.name || 'User' }}</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" (click)="goToDashboard()"><i class="fa fa-dashboard me-2"></i>Dashboard</a></li>
                            <li><a class="dropdown-item" routerLink="/my-trips"><i class="fa fa-suitcase me-2"></i>My trips</a></li>
                            <li><a class="dropdown-item" routerLink="/partner"><i class="fa fa-building me-2"></i>My listings</a></li>
                            <li *ngIf="currentUser?.role === 'admin'"><a class="dropdown-item" routerLink="/admin"><i class="fa fa-shield me-2"></i>Admin</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" (click)="logout()"><i class="fa fa-sign-out me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </ng-container>
            </div>
        </div>
    </nav>
</div>
