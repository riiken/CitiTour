        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="fa fa-bars"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto py-0">

                <a routerLink="/services" class="nav-item nav-link" (click)="navClicked('services')" [ngClass]="{'active':activeNav === 'services'}">Services</a>

                <a routerLink="/contact" class="nav-item nav-link" (click)="navClicked('contact')" [ngClass]="{'active':activeNav === 'contact'}">Contact</a>
            </div>

            <!-- Auth Buttons -->
            <div class="d-flex align-items-center ms-3">
                <!-- Not Logged In -->
                <ng-container *ngIf="!isLoggedIn">
                    <button class="btn btn-outline-primary rounded-pill py-2 px-4 me-2" (click)="goToLogin()">
                        <i class="fa fa-sign-in me-2"></i>Login
                    </button>
                    <button class="btn btn-primary rounded-pill py-2 px-4" (click)="goToRegister()">
                        <i class="fa fa-user-plus me-2"></i>Register
                    </button>
                </ng-container>

                <!-- Logged In -->
                <ng-container *ngIf="isLoggedIn">
                    <div class="dropdown">
                        <button class="btn btn-primary rounded-pill py-2 px-3 dropdown-toggle d-flex align-items-center"
                                type="button"
                                id="userDropdown"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            <div class="user-avatar me-2">{{ getUserInitial() }}</div>
                            <span class="d-none d-md-inline">{{ currentUser?.name || 'User' }}</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" (click)="goToDashboard()"><i class="fa fa-dashboard me-2"></i>Dashboard</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" (click)="logout()"><i class="fa fa-sign-out me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </ng-container>
            </div>
        </div>
    </nav>
</div>
