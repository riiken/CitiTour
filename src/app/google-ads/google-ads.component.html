@if (enabled) {
  <div class="ads-container">
    <span class="ads-label">Advertisement</span>
    <ins class="adsbygoogle"
      style="display:block"
      [attr.data-ad-client]="client"
      [attr.data-ad-slot]="slot"
      data-ad-format="auto"
    data-full-width-responsive="true"></ins>
  </div>
}
