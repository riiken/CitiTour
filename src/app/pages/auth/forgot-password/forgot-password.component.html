<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Forgot your password?</h1>
      <p>Enter your email and we'll send you a link to set a new one.</p>
    </div>

    @if (sentMessage) {
      <div>
        <div class="alert alert-success">{{ sentMessage }}</div>
        <p class="small text-muted">Didn't get it? Check your spam folder, or try again in a few minutes.</p>
        <a routerLink="/login" class="btn btn-primary btn-block">Back to login</a>
      </div>
    } @else {
      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" [(ngModel)]="email" [class.is-invalid]="error"
            placeholder="you@example.com" autocomplete="email" required />
          @if (error) {
            <div class="invalid-feedback">{{ error }}</div>
          }
        </div>
        <button type="submit" class="btn btn-primary btn-block" [disabled]="sending">
          {{ sending ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>
      <div class="register-link"><a routerLink="/login">Back to login</a></div>
    }

  </div>
</div>
