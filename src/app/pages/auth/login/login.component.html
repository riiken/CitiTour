<div class="login-container">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to access your CitiTour account</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="submitted && f['email'].errors"
          placeholder="Enter your email"
        />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
          <div *ngIf="f['email'].errors['required']">Email is required</div>
          <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            id="password"
            formControlName="password"
            class="form-control"
            [class.is-invalid]="submitted && f['password'].errors"
            placeholder="Enter your password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="hidePassword = !hidePassword"
          >
            <i class="fa" [class.fa-eye]="hidePassword" [class.fa-eye-slash]="!hidePassword"></i>
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
          <div *ngIf="f['password'].errors['minlength']">Password must be at least 8 characters</div>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <span></span>
        <a routerLink="/forgot-password" [queryParams]="{ email: f['email'].value || null }" class="forgot-password">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">
          <i class="fa fa-spinner fa-spin"></i> Signing in...
        </span>
      </button>

      <!-- Register Link -->
      <div class="register-link">
        Don't have an account?
        <a (click)="goToRegister()" class="link-primary">Sign up</a>
      </div>
    </form>

    <!-- Social Login (Optional for later) -->
    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-login">
      <button class="btn btn-google" disabled>
        <i class="fa fa-google"></i> Google (Coming Soon)
      </button>
    </div>
  </div>
</div>
