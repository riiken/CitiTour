<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Set a new password</h1>
      @if (linkValid) {
        <p>For {{ email }}</p>
      }
    </div>

    @if (!linkValid) {
      <div>
        <div class="alert alert-warning">This reset link is incomplete. Please use the link from the email, or request a new one.</div>
        <a routerLink="/forgot-password" class="btn btn-primary btn-block">Request a new link</a>
      </div>
    }

    @if (linkValid) {
      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" class="form-control" [(ngModel)]="confirm" autocomplete="new-password" required />
        </div>
        @if (error) {
          <div class="alert alert-danger py-2">
            {{ error }}
            @if (error.includes('expired')) {
              <a routerLink="/forgot-password" [queryParams]="{ email: email }"> Request a new link</a>
            }
          </div>
        }
        <button type="submit" class="btn btn-primary btn-block" [disabled]="saving">{{ saving ? 'Saving…' : 'Change password' }}</button>
      </form>
    }
  </div>
</div>
