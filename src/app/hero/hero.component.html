<div class="container-fluid bg-primary py-5 mb-5 hero-header">
    <div class="container py-5">
      <div class="row justify-content-center py-5">
        <div class="col-lg-10 pt-lg-5 mt-lg-5 text-center">
          <h1 class="display-3 text-white mb-3 animated slideInDown">Plan your next trip in minutes</h1>
          <p class="fs-4 text-white mb-4 animated slideInDown">
            Real hotels, restaurants and things to do, with an AI travel guide for your dates.
          </p>
          <div class="position-relative w-75 mx-auto animated slideInDown">
            <input
              class="form-control border-0 rounded-pill w-100 py-3 ps-4 pe-5"
              type="text"
              placeholder="Where to? e.g. Goa, Jaipur, Manali"
              aria-label="Destination"
              [(ngModel)]="searchQuery"
              (keyup.enter)="onSearch()"
            />
            <button
              type="button"
              class="btn btn-primary rounded-pill py-2 px-4 position-absolute top-0 end-0 me-2"
              style="margin-top: 7px;"
              (click)="onSearch()"
              aria-label="Search"
            >
            <span class="d-none d-md-inline">Plan my trip</span> <!-- Show "Search" on larger screens -->
            <i class="fa fa-search d-inline d-md-none"></i> <!-- Show search icon on small screens -->
            </button>
          </div>
          <p class="mt-3 mb-0"><a routerLink="/explore" class="text-white text-decoration-underline">or explore a destination first</a></p>
          <div class="popular-chips mt-3">
            <span class="text-white me-2">Popular:</span>
            <button type="button" class="btn btn-sm btn-light rounded-pill me-2 mb-2"
                    *ngFor="let destination of popularDestinations" (click)="searchFor(destination)">
              {{ destination }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
